<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" font-family="ui-sans-serif, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4.2 L0,8.4 Z" fill="#1565c0"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="7" refY="4.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4.2 L0,8.4 Z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="4" y="4" width="992" height="722" rx="14" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Corrected system architecture — parallel isolated input loop</text>
  <text x="500" y="60" text-anchor="middle" font-size="12.5" fill="#64748b">Observation and action form a closed loop across an isolation boundary — no game API, pixels in and synthetic input out.</text>

  <!-- Region: HOST -->
  <rect x="40" y="90" width="430" height="530" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="118" font-size="14.5" font-weight="700" fill="#1565c0">HOST — user's main desktop</text>
  <text x="60" y="136" font-size="11.5" fill="#1565c0">user works normally, undisturbed</text>

  <!-- Region: SANDBOX -->
  <rect x="530" y="90" width="430" height="530" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="948" y="118" text-anchor="end" font-size="14.5" font-weight="700" fill="#4527a0">SANDBOX — VM guest / separate session (VD)</text>
  <text x="948" y="136" text-anchor="end" font-size="11.5" fill="#4527a0">own input queue, RIT &amp; input desktop</text>

  <!-- Host: user real input note -->
  <rect x="70" y="152" width="370" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="255" y="171" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">Real keyboard &amp; mouse — stay on host desktop</text>
  <text x="255" y="187" text-anchor="middle" font-size="11" fill="#64748b">never routed into the sandbox (untouched)</text>

  <!-- AI system box -->
  <rect x="80" y="222" width="350" height="104" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="255" y="262" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">AI system</text>
  <text x="255" y="286" text-anchor="middle" font-size="12" fill="#0f172a">policy → actions</text>
  <text x="255" y="306" text-anchor="middle" font-size="10.5" fill="#64748b">reasons on the observed frame</text>

  <!-- Process tracker box -->
  <rect x="80" y="466" width="350" height="112" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="255" y="500" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Process tracker</text>
  <text x="255" y="522" text-anchor="middle" font-size="12" fill="#0f172a">screen / framebuffer capture</text>
  <text x="255" y="542" text-anchor="middle" font-size="11.5" fill="#0f172a">pixels → state representation</text>
  <text x="255" y="561" text-anchor="middle" font-size="10.5" fill="#c62828" font-weight="600">no application API</text>

  <!-- Process companion box -->
  <rect x="570" y="222" width="350" height="104" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="745" y="258" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Process companion</text>
  <text x="745" y="280" text-anchor="middle" font-size="12" fill="#0f172a">input injector (in-sandbox)</text>
  <text x="745" y="300" text-anchor="middle" font-size="10.5" fill="#64748b">SendInput / virtual HID device</text>

  <!-- Target app box -->
  <rect x="570" y="466" width="350" height="112" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="745" y="500" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">Target app — e.g. Minecraft</text>
  <text x="745" y="522" text-anchor="middle" font-size="12" fill="#0f172a">reads its own input stream</text>
  <text x="745" y="542" text-anchor="middle" font-size="10.5" fill="#64748b">raw input · DirectInput · GetAsyncKeyState</text>
  <text x="745" y="561" text-anchor="middle" font-size="10.5" fill="#2e7d32" font-weight="600">renders a new frame each tick</text>

  <!-- Isolation boundary -->
  <line x1="500" y1="96" x2="500" y2="614" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- ACTION / INPUT channel (blue) -->
  <!-- A: AI -> companion (across, top) -->
  <line x1="432" y1="274" x2="566" y2="274" stroke="#1565c0" stroke-width="2.6" marker-end="url(#ah-blue)"/>
  <!-- B: companion -> app (down) -->
  <line x1="745" y1="328" x2="745" y2="462" stroke="#1565c0" stroke-width="2.6" marker-end="url(#ah-blue)"/>

  <!-- OBSERVATION channel (green) -->
  <!-- C: app -> tracker (across, bottom) -->
  <line x1="566" y1="524" x2="434" y2="524" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#ah-green)"/>
  <!-- D: tracker -> AI (up) -->
  <line x1="255" y1="462" x2="255" y2="330" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#ah-green)"/>

  <!-- Edge label pills -->
  <g font-size="11">
    <!-- A -->
    <rect x="438" y="255" width="124" height="22" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
    <text x="500" y="270" text-anchor="middle" fill="#1565c0" font-weight="600">policy → actions</text>
    <!-- B -->
    <rect x="628" y="383" width="234" height="22" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
    <text x="745" y="398" text-anchor="middle" fill="#1565c0" font-weight="600">virtual input → game (synthetic HID)</text>
    <!-- C -->
    <rect x="404" y="505" width="192" height="22" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
    <text x="500" y="520" text-anchor="middle" fill="#2e7d32" font-weight="600">rendered frame → capture</text>
    <!-- D -->
    <rect x="196" y="383" width="118" height="22" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
    <text x="255" y="398" text-anchor="middle" fill="#2e7d32" font-weight="600">pixels → state</text>
  </g>

  <!-- Channel captions -->
  <text x="500" y="220" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1565c0" letter-spacing="0.5">ACTION / INPUT  ▸</text>
  <text x="500" y="592" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2e7d32" letter-spacing="0.5">◂  OBSERVATION</text>

  <!-- Center annotation -->
  <rect x="332" y="418" width="336" height="30" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/>
  <text x="500" y="437" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">no application API — pixels in, synthetic input out</text>

  <!-- Boundary bottom pill -->
  <rect x="326" y="626" width="348" height="26" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="500" y="643" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">isolation boundary — no shared input queue</text>

  <!-- Legend + captions -->
  <g font-size="11">
    <line x1="60" y1="682" x2="92" y2="682" stroke="#1565c0" stroke-width="2.6" marker-end="url(#ah-blue)"/>
    <text x="100" y="686" fill="#334155">ACTION: AI → companion → virtual input → game</text>
    <line x1="60" y1="704" x2="92" y2="704" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#ah-green)"/>
    <text x="100" y="708" fill="#334155">OBSERVATION: game framebuffer / video → tracker</text>
  </g>
  <text x="948" y="686" text-anchor="end" font-size="11" font-weight="600" fill="#0f172a">Loop: capture → policy → inject → game → render → capture</text>
  <text x="948" y="708" text-anchor="end" font-size="11" fill="#64748b">parallel &amp; isolated — the user's real keyboard/mouse are untouched</text>
</svg>