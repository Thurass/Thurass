<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="ui-sans-serif, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="5" y="5" width="1170" height="850" rx="16" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="590" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">End-to-End Keystroke Journey</text>
  <text x="590" y="62" text-anchor="middle" font-size="13" fill="#475569">Hook → encode → transport → decode → inject → target window — crossing a desktop boundary inside one session</text>

  <!-- ===================== REGIONS ===================== -->
  <rect x="25" y="95" width="325" height="650" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <rect x="366" y="95" width="324" height="650" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="706" y="95" width="449" height="650" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>

  <!-- Region headers -->
  <text x="42" y="121" font-size="12.5" font-weight="700" fill="#0d47a1">INTERACTIVE INPUT DESKTOP</text>
  <text x="42" y="138" font-size="11" fill="#1565c0">WinSta0\Default · visible · receives hardware input</text>

  <text x="382" y="121" font-size="12.5" font-weight="700" fill="#334155">SESSION KERNEL-OBJECT NAMESPACE</text>
  <text x="382" y="138" font-size="11" fill="#64748b">Local\ BaseNamedObjects · desktop-independent</text>

  <text x="722" y="121" font-size="12.5" font-weight="700" fill="#4527a0">HIDDEN VIRTUAL DESKTOP</text>
  <text x="722" y="138" font-size="11" fill="#5e35b1">WinSta0\Sandbox · never SwitchDesktop'd → no input</text>

  <!-- Desktop walls -->
  <line x1="358" y1="150" x2="358" y2="745" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="698" y1="150" x2="698" y2="745" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text transform="rotate(-90 361 500)" x="361" y="500" text-anchor="middle" font-size="10" fill="#64748b">desktop wall — USER objects stop</text>
  <text transform="rotate(-90 701 500)" x="701" y="500" text-anchor="middle" font-size="10" fill="#64748b">desktop wall — USER objects stop</text>

  <!-- ===================== STAGE CARDS ===================== -->

  <!-- 1 CAPTURE -->
  <rect x="38" y="150" width="300" height="180" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="58" cy="171" r="13" fill="#e65100"/>
  <text x="58" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="78" y="176" font-size="13.5" font-weight="700" fill="#7c2d12">CAPTURE — WH_KEYBOARD_LL hook</text>
  <text x="54" y="200" font-size="12.5" fill="#0f172a">Runs on a thread with a message loop</text>
  <text x="54" y="218" font-size="12.5" fill="#0f172a">(no pump ⇒ callback never fires)</text>
  <text x="54" y="236" font-size="12.5" fill="#0f172a">Callback executes in the installing thread</text>
  <text x="54" y="254" font-size="12.5" fill="#1b5e20">Return ≠ 0 ⇒ suppress (route only to us)</text>
  <text x="54" y="272" font-size="12.5" fill="#0f172a">Finish &lt; LowLevelHooksTimeout (≤1000 ms)</text>
  <text x="54" y="290" font-size="12.5" fill="#0f172a">or the hook is silently removed</text>
  <text x="54" y="314" font-size="12" fill="#334155">Reads KBDLLHOOKSTRUCT: vkCode·scanCode·flags</text>

  <!-- 2 ENCODE -->
  <rect x="38" y="360" width="300" height="165" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="58" cy="381" r="13" fill="#e65100"/>
  <text x="58" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="78" y="386" font-size="13.5" font-weight="700" fill="#7c2d12">ENCODE — capture &amp; hand off</text>
  <text x="54" y="411" font-size="12.5" fill="#b71c1c">No blocking / alloc / syscall in the callback</text>
  <text x="54" y="429" font-size="12.5" fill="#0f172a">Write fixed record → lock-free ring slot</text>
  <text x="54" y="447" font-size="12.5" fill="#0f172a">seqlock stamp; write payload, then index</text>
  <text x="54" y="465" font-size="12.5" fill="#0f172a">Release store = plain MOV on x86/64</text>
  <text x="54" y="483" font-size="12" fill="#334155">(StoreStore kept in order; compiler barrier)</text>

  <!-- 3 TRANSPORT -->
  <rect x="378" y="215" width="300" height="340" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="398" cy="240" r="13" fill="#e65100"/>
  <text x="398" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="418" y="245" font-size="13.5" font-weight="700" fill="#7c2d12">TRANSPORT (crosses the wall)</text>
  <text x="394" y="270" font-size="12.5" fill="#b71c1c">USER objects (windows, messages, hooks)</text>
  <text x="394" y="288" font-size="12.5" fill="#b71c1c">are desktop-bound and cannot cross here.</text>
  <text x="394" y="310" font-size="12.5" fill="#1b5e20">Kernel objects are desktop-independent:</text>
  <text x="394" y="332" font-size="12.5" fill="#0f172a">• Section (pagefile-backed) = shared ring</text>
  <text x="394" y="350" font-size="12" fill="#334155">   for the high-rate keystroke stream</text>
  <text x="394" y="372" font-size="12.5" fill="#0f172a">• Auto-reset event = one wake per burst</text>
  <text x="394" y="390" font-size="12" fill="#334155">   (coalesces notifications, no counting)</text>
  <text x="394" y="412" font-size="12.5" fill="#0f172a">• Message-mode pipe = framed control</text>
  <text x="394" y="430" font-size="12" fill="#334155">   handshake / version / flush / shutdown</text>
  <text x="394" y="452" font-size="12.5" fill="#0f172a">Named in Local\ — same session, so no</text>
  <text x="394" y="470" font-size="12.5" fill="#0f172a">Global\ and no SeCreateGlobalPrivilege</text>

  <!-- 4 DECODE -->
  <rect x="720" y="150" width="420" height="160" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="740" cy="171" r="13" fill="#e65100"/>
  <text x="740" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="760" y="176" font-size="13.5" font-weight="700" fill="#7c2d12">DECODE — consumer on the sandbox desktop</text>
  <text x="736" y="201" font-size="12.5" fill="#0f172a">Dedicated thread SetThreadDesktop'd to the sandbox</text>
  <text x="736" y="219" font-size="12.5" fill="#0f172a">before it owns any window or hook</text>
  <text x="736" y="237" font-size="12.5" fill="#0f172a">Acquire-load the published index; copy the slot</text>
  <text x="736" y="255" font-size="12.5" fill="#0f172a">Re-check seqlock before &amp; after the copy</text>
  <text x="736" y="273" font-size="12" fill="#b71c1c">(reject a torn / half-overwritten record)</text>

  <!-- 5 INJECT -->
  <rect x="720" y="340" width="420" height="215" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="740" cy="361" r="13" fill="#e65100"/>
  <text x="740" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <text x="760" y="366" font-size="13.5" font-weight="700" fill="#7c2d12">INJECT — message layer, not SendInput</text>
  <text x="736" y="391" font-size="12.5" fill="#b71c1c">SendInput reaches only the current INPUT desktop</text>
  <text x="736" y="409" font-size="12.5" fill="#b71c1c">⇒ it does nothing on this hidden desktop</text>
  <text x="736" y="431" font-size="12.5" fill="#0f172a">Drive target windows through the message queue:</text>
  <text x="736" y="449" font-size="12.5" fill="#0f172a">EnumDesktopWindows(hDesk) → top-level HWNDs</text>
  <text x="736" y="467" font-size="12.5" fill="#0f172a">EnumChildWindows → the actual leaf control</text>
  <text x="736" y="485" font-size="12.5" fill="#0f172a">PostMessage WM_KEYDOWN / WM_CHAR / WM_KEYUP</text>
  <text x="736" y="503" font-size="12" fill="#334155">lParam: MapVirtualKey scan code + extended bit 24;</text>
  <text x="736" y="521" font-size="12" fill="#334155">WM_KEYUP sets bit 30 &amp; bit 31</text>
  <text x="736" y="543" font-size="12.5" fill="#b71c1c">UIPI: injector integrity ≥ target, or post silently no-ops</text>

  <!-- 6 TARGET -->
  <rect x="720" y="585" width="420" height="115" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <circle cx="740" cy="606" r="13" fill="#e65100"/>
  <text x="740" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <text x="760" y="611" font-size="13.5" font-weight="700" fill="#7c2d12">TARGET WINDOW</text>
  <text x="736" y="636" font-size="12.5" fill="#0f172a">GUI app reads via GetMessage / TranslateMessage</text>
  <text x="736" y="658" font-size="12.5" fill="#b71c1c">Synthetic only — invisible to Raw Input, DirectInput</text>
  <text x="736" y="676" font-size="12.5" fill="#b71c1c">and GetAsyncKeyState polling (games / anti-cheat)</text>

  <!-- ===================== ARROWS ===================== -->
  <line x1="188" y1="330" x2="188" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="338" y1="442" x2="376" y2="442" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="678" y1="272" x2="718" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="310" x2="930" y2="338" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="555" x2="930" y2="583" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow labels (pills) -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <rect x="160" y="336" width="56" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="188" y="348">hand off</text>
    <rect x="329" y="424" width="52" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="355" y="436">publish</text>
    <rect x="662" y="238" width="62" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="693" y="250">consume</text>
    <rect x="903" y="316" width="54" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="930" y="328">record</text>
    <rect x="905" y="561" width="50" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/><text x="930" y="573">post</text>
  </g>

  <!-- ===================== FOOTER ===================== -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="770" width="15" height="15" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="62" y="782">Interactive input desktop</text>
    <rect x="255" y="770" width="15" height="15" rx="3" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
    <text x="277" y="782">Hidden virtual desktop</text>
    <rect x="455" y="770" width="15" height="15" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="477" y="782">Kernel-object transport</text>
    <rect x="665" y="770" width="15" height="15" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="687" y="782">Pipeline stage</text>
  </g>
  <rect x="30" y="800" width="1120" height="30" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="590" y="820" text-anchor="middle" font-size="12.5" fill="#b71c1c">Isolation is UI-only: files · registry · kernel objects · process token · clipboard all stay shared across the wall — a desktop is not a security sandbox.</text>
</svg>