<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 740" font-family="ui-sans-serif, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="mk-green" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/></marker>
    <marker id="mk-slate" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="mk-red" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/></marker>
    <marker id="mk-purple" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4527a0"/></marker>
  </defs>

  <!-- background -->
  <rect x="8" y="8" width="1164" height="724" rx="18" fill="#fbfdff" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="24" y="34" font-size="18" font-weight="700" fill="#0f172a">Process / Desktop Topology — forwarder, companion agent, one cross-desktop transport</text>
  <text x="24" y="54" font-size="12.5" fill="#64748b">One session · WinSta0 · Default (visible input) + Sandbox (hidden) · USER objects are desktop-bound, kernel objects are not.</text>

  <!-- ============ SESSION CONTAINER ============ -->
  <rect x="24" y="66" width="1132" height="254" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <text x="40" y="87" font-size="13" font-weight="700" fill="#0f172a">One interactive session · one window station WinSta0 · two desktops</text>

  <!-- Default panel -->
  <rect x="44" y="98" width="440" height="208" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="56" y="118" font-size="12.5" font-weight="700" fill="#0f172a">WinSta0\Default — the visible input desktop</text>
  <!-- Process A -->
  <rect x="56" y="128" width="416" height="170" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="68" y="150" font-size="13" font-weight="700" fill="#0f172a">Process A — Forwarder</text>
  <text x="68" y="168" font-size="10.5" fill="#475569">Capture thread runs on WinSta0\Default</text>
  <text x="68" y="190" font-size="10.5" fill="#334155">• Installs WH_KEYBOARD_LL / WH_MOUSE_LL</text>
  <text x="68" y="208" font-size="10.5" fill="#334155">• Runs a mandatory message pump (keeps hooks alive)</text>
  <text x="68" y="226" font-size="10.5" fill="#334155">• Suppresses an event by returning nonzero</text>
  <text x="68" y="246" font-size="10.5" fill="#334155">• Capture-and-hand-off only — never blocks in the callback</text>

  <!-- USER boundary wall -->
  <rect x="494" y="98" width="22" height="208" rx="3" fill="#eef2f7" stroke="#64748b"/>
  <text transform="rotate(-90 500 202)" x="500" y="202" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">USER boundary</text>
  <text transform="rotate(-90 511 202)" x="511" y="202" text-anchor="middle" font-size="7.8" fill="#475569">HWND · HHOOK · message-queue = desktop-bound</text>

  <!-- Sandbox panel -->
  <rect x="524" y="98" width="612" height="208" rx="8" fill="#ede7f6" stroke="#4527a0"/>
  <text x="536" y="117" font-size="12.5" font-weight="700" fill="#0f172a">WinSta0\Sandbox — hidden desktop, never SwitchDesktop'd</text>
  <text x="536" y="132" font-size="10" fill="#475569">receives no hardware or synthesized input</text>
  <!-- Process B -->
  <rect x="536" y="146" width="238" height="152" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="548" y="167" font-size="12.5" font-weight="700" fill="#0f172a">Process B — Companion agent</text>
  <text x="548" y="184" font-size="10.5" fill="#475569">Injector thread on WinSta0\Sandbox</text>
  <text x="548" y="204" font-size="10.5" fill="#334155">• SetThreadDesktop(Sandbox) before it</text>
  <text x="558" y="216" font-size="10.5" fill="#334155">owns any window or hook</text>
  <text x="548" y="236" font-size="10.5" fill="#334155">• Consumes the ring; builds</text>
  <text x="558" y="248" font-size="10.5" fill="#334155">WM_KEY* / WM_*BUTTON* messages</text>
  <!-- Process C -->
  <rect x="888" y="146" width="238" height="152" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="900" y="167" font-size="12.5" font-weight="700" fill="#0f172a">Process C — Hosted app</text>
  <text x="900" y="185" font-size="10.5" fill="#475569">Launched with STARTUPINFO.lpDesktop</text>
  <text x="900" y="197" font-size="10.5" fill="#475569">= "WinSta0\Sandbox"</text>
  <text x="900" y="217" font-size="10.5" fill="#334155">• Top-level windows + a pump</text>
  <text x="900" y="235" font-size="10.5" fill="#334155">• GetMessage / TranslateMessage</text>
  <text x="900" y="253" font-size="10.5" fill="#334155">• Renders off-screen</text>
  <!-- same-desktop message arrow B -> C -->
  <line x1="775" y1="252" x2="885" y2="252" stroke="#4527a0" stroke-width="1.8" marker-end="url(#mk-purple)"/>
  <rect x="776" y="192" width="110" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="831" y="207" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4527a0">PostMessage /</text>
  <text x="831" y="220" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4527a0">SendMessageTimeout</text>

  <!-- blocked cross-desktop window message on the wall -->
  <line x1="474" y1="246" x2="495" y2="246" stroke="#c62828" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#mk-red)"/>
  <circle cx="505" cy="246" r="8" fill="none" stroke="#c62828" stroke-width="1.8"/>
  <line x1="499.6" y1="240.6" x2="510.4" y2="251.4" stroke="#c62828" stroke-width="1.8"/>

  <!-- ============ KERNEL BAND ============ -->
  <rect x="24" y="392" width="1132" height="218" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="40" y="414" font-size="13" font-weight="700" fill="#0f172a">Session kernel objects — desktop-independent, shared across both desktops in one session</text>
  <text x="40" y="432" font-size="10.5" fill="#33691e">Both resolve within one session and reach across both desktops — no Global\ prefix, no SeCreateGlobalPrivilege.</text>

  <!-- ring box (below Default / forwarder) -->
  <rect x="48" y="442" width="536" height="156" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="64" y="464" font-size="12.5" font-weight="700" fill="#0f172a">Shared-memory ring — high-rate input stream</text>
  <text x="64" y="484" font-size="10.5" fill="#334155">Local\ pagefile-backed section + auto-reset event</text>
  <text x="64" y="503" font-size="10.5" fill="#334155">Lock-free: producer (the LL-hook callback) never blocks or syscalls</text>
  <text x="64" y="522" font-size="10.5" fill="#334155">Per-slot seqlock re-checked for torn reads · release / acquire publish</text>
  <text x="64" y="547" font-size="10" fill="#475569">Section &amp; event resolve in the per-session Local\ namespace</text>
  <text x="64" y="561" font-size="10" fill="#475569">(\Sessions\N\BaseNamedObjects)</text>

  <!-- pipe box (below Sandbox / agent) -->
  <rect x="596" y="442" width="536" height="156" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text x="612" y="464" font-size="12.5" font-weight="700" fill="#0f172a">Named pipe — low-rate control channel</text>
  <text x="612" y="484" font-size="10.5" fill="#334155">\\.\pipe\name · PIPE_TYPE_MESSAGE — framed per-message</text>
  <text x="612" y="503" font-size="10.5" fill="#334155">Handshake · version + record_size negotiate · flush · shutdown · ack</text>
  <text x="612" y="522" font-size="10.5" fill="#334155">Every reading handle must set PIPE_READMODE_MESSAGE</text>
  <text x="612" y="547" font-size="10" fill="#b71c1c">NOT a BaseNamedObjects object — lives in \Device\NamedPipe</text>
  <text x="612" y="561" font-size="10" fill="#b71c1c">as \\.\pipe\name (still cross-desktop within the session)</text>

  <!-- ============ CONNECTORS (drawn on top) ============ -->
  <!-- produce: forwarder -> ring -->
  <line x1="200" y1="298" x2="200" y2="442" stroke="#2e7d32" stroke-width="2" marker-end="url(#mk-green)"/>
  <!-- consume: ring -> agent -->
  <line x1="555" y1="442" x2="618" y2="298" stroke="#2e7d32" stroke-width="2" marker-end="url(#mk-green)"/>
  <!-- control: agent <-> pipe -->
  <line x1="720" y1="298" x2="720" y2="442" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-start="url(#mk-slate)" marker-end="url(#mk-slate)"/>
  <!-- control: forwarder <-> pipe -->
  <path d="M340,298 L340,376 L650,376 L650,442" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3" marker-start="url(#mk-slate)" marker-end="url(#mk-slate)"/>

  <!-- pills in the open gap band -->
  <rect x="140" y="347" width="132" height="18" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="206" y="360" text-anchor="middle" font-size="10" fill="#0f172a">produce · release store</text>

  <rect x="535" y="340" width="128" height="18" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="599" y="353" text-anchor="middle" font-size="10" fill="#0f172a">consume · acquire load</text>

  <rect x="372" y="367" width="58" height="18" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="401" y="380" text-anchor="middle" font-size="10" fill="#0f172a">control</text>

  <rect x="691" y="349" width="58" height="18" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="720" y="362" text-anchor="middle" font-size="10" fill="#0f172a">control</text>

  <rect x="356" y="316" width="200" height="18" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="456" y="329" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c62828">✕  cross-desktop window message blocked</text>

  <!-- SendInput red note -->
  <rect x="838" y="326" width="294" height="60" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="852" y="344" font-size="9.6" fill="#b71c1c">SendInput can't reach a hidden desktop — it lands</text>
  <text x="852" y="356" font-size="9.6" fill="#b71c1c">on whatever desktop is the current input desktop;</text>
  <text x="852" y="368" font-size="9.6" fill="#b71c1c">the sandbox is driven purely through the message</text>
  <text x="852" y="380" font-size="9.6" fill="#b71c1c">layer.</text>

  <!-- ============ FOOTER CAVEATS ============ -->
  <rect x="24" y="624" width="556" height="88" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <circle cx="48" cy="650" r="9" fill="#c62828"/>
  <text x="48" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="66" y="649" font-size="12.5" font-weight="700" fill="#0f172a">Not a security sandbox</text>
  <text x="40" y="672" font-size="10.5" fill="#334155">The desktop isolates only USER objects. Same token, files, registry,</text>
  <text x="40" y="688" font-size="10.5" fill="#334155">kernel objects &amp; process list all stay shared.</text>

  <rect x="600" y="624" width="556" height="88" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <circle cx="624" cy="650" r="9" fill="#c62828"/>
  <text x="624" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">!</text>
  <text x="642" y="649" font-size="12.5" font-weight="700" fill="#0f172a">Restore discipline</text>
  <text x="616" y="672" font-size="10.5" fill="#334155">Never leave Sandbox as the input desktop. The secure desktop</text>
  <text x="616" y="688" font-size="10.5" fill="#334155">(UAC / lock / Ctrl+Alt+Del) transiently seizes the input role and</text>
  <text x="616" y="704" font-size="10.5" fill="#334155">denies SwitchDesktop.</text>
</svg>