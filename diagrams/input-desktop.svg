<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="ui-sans-serif, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ahGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2e7d32"/></marker>
    <marker id="ahRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c62828"/></marker>
  </defs>

  <!-- background for dark-mode legibility -->
  <rect x="4" y="4" width="1032" height="712" rx="16" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- title -->
  <text x="36" y="46" font-size="20" font-weight="700" fill="#0f172a">The single input-desktop constraint</text>
  <text x="36" y="72" font-size="13.5" fill="#475569">Hardware input and SendInput reach only the visible desktop — a hidden desktop must be driven through window messages.</text>

  <!-- ================= LEFT: input-desktop-gated injectors ================= -->
  <!-- hardware input -->
  <rect x="36" y="150" width="250" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="180" font-size="14" font-weight="700" fill="#0f172a">Hardware input</text>
  <text x="52" y="200" font-size="12" fill="#475569">Physical keyboard / mouse</text>
  <text x="52" y="218" font-size="11" fill="#64748b">delivered by the OS input path</text>

  <!-- SendInput -->
  <rect x="36" y="250" width="250" height="96" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="52" y="278" font-size="14" font-weight="700" fill="#e65100">SendInput</text>
  <text x="52" y="298" font-size="12" fill="#7c2d12">keybd_event · mouse_event</text>
  <text x="52" y="316" font-size="11" fill="#9a3412">synthesized input into the caller</text>
  <text x="52" y="332" font-size="11" fill="#9a3412">thread's current-desktop input stream</text>

  <!-- reaches pills -->
  <rect x="289" y="176" width="49" height="18" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="313" y="189" font-size="9.5" fill="#2e7d32" text-anchor="middle">✓ reaches</text>
  <rect x="289" y="296" width="49" height="18" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="313" y="309" font-size="9.5" fill="#2e7d32" text-anchor="middle">✓ reaches</text>

  <!-- arrows into Default (the input desktop) -->
  <path d="M286,190 C324,190 330,306 356,306" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ahGreen)"/>
  <path d="M286,298 C326,298 332,356 356,356" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ahGreen)"/>

  <!-- why-not-switch note -->
  <rect x="36" y="366" width="250" height="182" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="392" font-size="13" font-weight="700" fill="#334155">Why not just switch to it?</text>
  <text x="52" y="416" font-size="12" fill="#475569">SendInput needs the caller's thread</text>
  <text x="52" y="434" font-size="12" fill="#475569">on the current input desktop.</text>
  <text x="52" y="458" font-size="12" fill="#475569">You could SwitchDesktop to Sandbox —</text>
  <text x="52" y="476" font-size="12" fill="#475569">but that makes it visible, defeating</text>
  <text x="52" y="494" font-size="12" fill="#475569">the whole hidden-desktop design.</text>
  <text x="52" y="524" font-size="12.5" font-weight="700" fill="#e65100">→ So drive it with messages instead.</text>

  <!-- ================= CENTER-RIGHT: WinSta0 ================= -->
  <rect x="340" y="118" width="664" height="430" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="356" y="140" font-size="13" font-weight="700" fill="#334155">WinSta0 — interactive window station (one per session)</text>

  <!-- invariant banner -->
  <rect x="356" y="150" width="632" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="672" y="175" font-size="12" fill="#0f172a" text-anchor="middle">Invariant: at most ONE input desktop at a time (chosen by SwitchDesktop) — only it is visible and receives hardware + synthesized input.</text>

  <!-- Default desktop (input desktop) -->
  <rect x="356" y="206" width="280" height="316" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="372" y="240" font-size="14" font-weight="700" fill="#0d47a1">Desktop: Default</text>
  <rect x="372" y="252" width="150" height="24" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="447" y="269" font-size="11" font-weight="700" fill="#2e7d32" text-anchor="middle">● INPUT DESKTOP</text>
  <text x="372" y="300" font-size="12" fill="#1565c0">The current input desktop</text>
  <text x="372" y="318" font-size="11" fill="#1976d2">visible on the physical display</text>
  <rect x="372" y="336" width="248" height="150" rx="6" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="386" y="360" font-size="11" font-weight="700" fill="#1565c0">Receives:</text>
  <text x="386" y="388" font-size="12" fill="#2e7d32">✓ Hardware keyboard / mouse</text>
  <text x="386" y="416" font-size="12" fill="#2e7d32">✓ SendInput / keybd_event</text>
  <text x="386" y="444" font-size="12" fill="#2e7d32">✓ Window messages</text>
  <text x="386" y="472" font-size="11" fill="#64748b">everything routes here</text>

  <!-- Sandbox desktop (hidden) -->
  <rect x="708" y="206" width="280" height="316" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="724" y="240" font-size="14" font-weight="700" fill="#311b92">Desktop: Sandbox</text>
  <rect x="724" y="252" width="176" height="24" rx="12" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="812" y="269" font-size="11" font-weight="700" fill="#455a64" text-anchor="middle">○ HIDDEN — not switched to</text>
  <text x="724" y="300" font-size="12" fill="#4527a0">Not the input desktop</text>
  <text x="724" y="318" font-size="11" fill="#5e35b1">never made visible (no SwitchDesktop)</text>
  <rect x="724" y="336" width="248" height="150" rx="6" fill="#ffffff" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="738" y="360" font-size="11" font-weight="700" fill="#4527a0">Receives:</text>
  <text x="738" y="388" font-size="12" fill="#c62828">✗ Hardware keyboard / mouse</text>
  <text x="738" y="416" font-size="12" fill="#c62828">✗ SendInput (needs input desktop)</text>
  <text x="738" y="444" font-size="12" fill="#2e7d32">✓ Window messages (per-desktop)</text>
  <text x="738" y="472" font-size="11" fill="#64748b">the only way in while hidden</text>

  <!-- barrier between desktops -->
  <rect x="660" y="290" width="24" height="172" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="672" y="312" font-size="18" font-weight="700" fill="#c62828" text-anchor="middle">✗</text>
  <text x="672" y="384" font-size="11" font-weight="600" fill="#c62828" text-anchor="middle" transform="rotate(-90 672 384)">hardware / SendInput blocked</text>
  <path d="M636,382 L656,382" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ahRed)"/>

  <!-- ================= BOTTOM: message layer ================= -->
  <rect x="520" y="586" width="484" height="102" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="536" y="610" font-size="13" font-weight="700" fill="#e65100">Message layer — the way into a hidden desktop</text>
  <text x="536" y="632" font-size="12" fill="#7c2d12">PostMessage / SendMessageTimeout → target HWNDs (via EnumDesktopWindows).</text>
  <text x="536" y="652" font-size="12" fill="#7c2d12">Window messages are per-desktop — not gated by the input desktop, so a worker</text>
  <text x="536" y="672" font-size="12" fill="#7c2d12">thread attached to Sandbox (SetThreadDesktop) drives its windows while hidden.</text>

  <!-- message arrow rising into Sandbox -->
  <path d="M660,586 C700,552 780,536 812,524" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#ahGreen)"/>
  <rect x="676" y="540" width="196" height="18" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="774" y="553" font-size="11" fill="#2e7d32" text-anchor="middle">posts to HWNDs on the hidden desktop</text>

  <!-- ================= legend ================= -->
  <rect x="36" y="584" width="460" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="608" font-size="12" font-weight="700" fill="#334155">Legend</text>
  <line x1="52" y1="626" x2="86" y2="626" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ahGreen)"/>
  <text x="98" y="630" font-size="12" fill="#475569">input received / message delivered (works)</text>
  <line x1="52" y1="650" x2="86" y2="650" stroke="#c62828" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#ahRed)"/>
  <text x="98" y="654" font-size="12" fill="#475569">input blocked — desktop is not the input desktop</text>
  <text x="52" y="678" font-size="11" font-style="italic" fill="#64748b">Task View "virtual desktops" are NOT this — they share the one input desktop.</text>
</svg>