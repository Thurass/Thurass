<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="ui-sans-serif, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="12" y="12" width="1216" height="876" rx="14" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="620" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Three meanings of &#8220;virtual desktop&#8221; on Windows 11</text>
  <text x="620" y="68" text-anchor="middle" font-size="14" fill="#475569">Why only the Win32 desktop object (HDESK) enables isolated per-agent input forwarding</text>
  <rect x="452" y="84" width="336" height="46" rx="8" fill="#0f172a"/>
  <text x="620" y="112" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">&#8220;Virtual desktop&#8221; = 3 unrelated concepts</text>
  <path d="M620,130 C620,150 225,150 225,173" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M620,130 L620,173" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M620,130 C620,150 1015,150 1015,173" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="184" y="143" width="82" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="225" y="156" fill="#334155">shell veneer</text>
    <rect x="572" y="143" width="96" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="620" y="156" fill="#334155">kernel object</text>
    <rect x="975" y="143" width="80" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="1015" y="156" fill="#334155">OS session</text>
  </g>
  <rect x="40" y="173" width="370" height="507" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <path d="M40,181 a8,8 0 0 1 8,-8 h354 a8,8 0 0 1 8,8 v64 h-370 z" fill="#64748b"/>
  <circle cx="72" cy="211" r="16" fill="#ffffff"/><text x="72" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#64748b">1</text>
  <text x="98" y="205" font-size="15" font-weight="700" fill="#ffffff">Task View virtual desktops</text>
  <text x="98" y="227" font-size="11.5" fill="#e2e8f0">Shell window-grouping veneer (twinui / DWM)</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="60" y="283" font-size="14" fill="#c62828">&#10007;</text><text x="82" y="283">Shares the single WinSta0\Default</text>
    <text x="60" y="312" font-size="14" fill="#c62828">&#10007;</text><text x="82" y="312">One shared input queue</text>
    <text x="60" y="341" font-size="14" fill="#c62828">&#10007;</text><text x="82" y="341">One shared HWND namespace</text>
    <text x="60" y="370" font-size="14" fill="#64748b">&#8211;</text><text x="82" y="370">Switch = DWM show/hide, no new HDESK</text>
    <text x="60" y="399" font-size="14" fill="#64748b">&#8211;</text><text x="82" y="399">IVirtualDesktopManager: query/move only</text>
  </g>
  <rect x="58" y="420" width="334" height="240" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="74" y="444" font-size="10.5" font-weight="700" letter-spacing="1" fill="#c62828">INPUT FORWARDING</text>
  <text x="74" y="470" font-size="15" font-weight="700" fill="#c62828">Nothing to forward to</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="74" y="498">Every window lives on one input</text>
    <text x="74" y="518">desktop with one queue &#8212; the</text>
    <text x="74" y="538">Task View &#8220;desktop&#8221; is not a</text>
    <text x="74" y="558">separate object at all.</text>
    <text x="74" y="588" font-weight="700" fill="#c62828">Zero input isolation possible.</text>
  </g>
  <rect x="435" y="173" width="370" height="507" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2.75"/>
  <path d="M435,181 a8,8 0 0 1 8,-8 h354 a8,8 0 0 1 8,8 v64 h-370 z" fill="#4527a0"/>
  <circle cx="467" cy="211" r="16" fill="#ffffff"/><text x="467" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#4527a0">2</text>
  <text x="493" y="205" font-size="15" font-weight="700" fill="#ffffff">Win32 desktop object (HDESK)</text>
  <text x="493" y="227" font-size="11.5" fill="#e9e2f7">CreateDesktopEx &#8212; securable object / WinSta0</text>
  <rect x="705" y="150" width="90" height="20" rx="10" fill="#2e7d32"/><text x="750" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">CORRECT</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="455" y="283" font-size="14" fill="#2e7d32">&#10003;</text><text x="477" y="283">Own HWND namespace + hook chains</text>
    <text x="455" y="312" font-size="14" fill="#2e7d32">&#10003;</text><text x="477" y="312">Per-desktop message / input routing</text>
    <text x="455" y="341" font-size="14" fill="#2e7d32">&#10003;</text><text x="477" y="341">Lockable DACL (CreateDesktopEx lpsa)</text>
    <text x="455" y="370" font-size="14" fill="#2e7d32">&#10003;</text><text x="477" y="370">Hidden background desktop = real GUI</text>
    <text x="455" y="399" font-size="14" fill="#2e7d32">&#10003;</text><text x="477" y="399">SetThreadDesktop binds the forwarder</text>
  </g>
  <rect x="453" y="420" width="334" height="240" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="469" y="444" font-size="10.5" font-weight="700" letter-spacing="1" fill="#2e7d32">INPUT FORWARDING</text>
  <text x="469" y="470" font-size="15" font-weight="700" fill="#2e7d32">Isolated forwarding &#10003;</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="469" y="498">SendInput reaches only the current</text>
    <text x="469" y="518">input desktop &#8212; so drive background</text>
    <text x="469" y="538">HWNDs with PostMessage /</text>
    <text x="469" y="558">SendMessageTimeout instead.</text>
    <text x="469" y="588" font-weight="700" fill="#2e7d32">No service &#183; driver &#183; hypervisor.</text>
  </g>
  <rect x="830" y="173" width="370" height="507" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <path d="M830,181 a8,8 0 0 1 8,-8 h354 a8,8 0 0 1 8,8 v64 h-370 z" fill="#1565c0"/>
  <circle cx="862" cy="211" r="16" fill="#ffffff"/><text x="862" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#1565c0">3</text>
  <text x="888" y="205" font-size="15" font-weight="700" fill="#ffffff">Separate WTS / RDP session</text>
  <text x="888" y="227" font-size="11.5" fill="#dbeafe">Fully parallel interactive session</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="850" y="283" font-size="14" fill="#2e7d32">&#10003;</text><text x="872" y="283">Own window station + desktops</text>
    <text x="850" y="312" font-size="14" fill="#2e7d32">&#10003;</text><text x="872" y="312">Genuinely parallel real input</text>
    <text x="850" y="341" font-size="14" fill="#e65100">&#9888;</text><text x="872" y="341">Crosses the Session 0 boundary</text>
    <text x="850" y="370" font-size="14" fill="#e65100">&#9888;</text><text x="872" y="370">Needs a Session-0 broker service</text>
    <text x="850" y="399" font-size="14" fill="#e65100">&#9888;</text><text x="872" y="399">WTSQueryUserToken &#8594; CreateProcessAsUser</text>
  </g>
  <rect x="848" y="420" width="334" height="240" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="864" y="444" font-size="10.5" font-weight="700" letter-spacing="1" fill="#e65100">INPUT FORWARDING</text>
  <text x="864" y="470" font-size="15" font-weight="700" fill="#e65100">Works, but heavyweight</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="864" y="498">Real parallel input &#8212; but requires</text>
    <text x="864" y="518">a privileged Session-0 broker to</text>
    <text x="864" y="538">create/launch into the session;</text>
    <text x="864" y="558">client SKUs allow ~one console.</text>
    <text x="864" y="588" font-weight="700" fill="#e65100">Service / higher privilege.</text>
  </g>
  <rect x="40" y="702" width="1160" height="98" rx="10" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <rect x="58" y="720" width="118" height="62" rx="8" fill="#4527a0"/>
  <text x="117" y="748" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">WHY</text>
  <text x="117" y="768" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">HDESK</text>
  <g font-size="13.5" fill="#0f172a">
    <text x="196" y="732">The <tspan font-weight="700">lowest-privilege</tspan> mechanism that yields a real, separately addressable input target &#8212; HWNDs on a private, DACL-locked</text>
    <text x="196" y="754">desktop &#8212; <tspan font-weight="700">without a service, driver, or hypervisor.</tspan> Task View shares one input desktop (nothing to isolate);</text>
    <text x="196" y="776">WTS sessions do isolate, but only by crossing Session 0 through a privileged broker service.</text>
  </g>
  <text x="40" y="838" font-size="12.5" font-weight="700" fill="#475569">Isolation still rests on 3 orthogonal walls:</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="298" y="826" width="168" height="22" rx="11" fill="#eef2f6" stroke="#64748b"/><text x="382" y="841">Session 0 isolation</text>
    <rect x="478" y="826" width="196" height="22" rx="11" fill="#eef2f6" stroke="#64748b"/><text x="576" y="841">Integrity levels + UIPI</text>
    <rect x="686" y="826" width="178" height="22" rx="11" fill="#eef2f6" stroke="#64748b"/><text x="775" y="841">Per-desktop DACLs</text>
  </g>
</svg>